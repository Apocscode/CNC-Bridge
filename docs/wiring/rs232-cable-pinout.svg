<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Consolas, monospace">
  <!-- Background -->
  <rect width="800" height="500" fill="#1e1e1e" rx="8"/>
  
  <!-- Title -->
  <text x="400" y="35" fill="#d4d4d4" font-size="18" text-anchor="middle" font-weight="bold">CNC Bridge — RS232 Cable Wiring Diagram</text>
  <text x="400" y="55" fill="#808080" font-size="12" text-anchor="middle">Anilam Crusader M/II → PC (USB-Serial Adapter)</text>

  <!-- DB-25 Male Connector (Controller Side) -->
  <rect x="50" y="90" width="260" height="340" fill="#2d2d2d" stroke="#555" stroke-width="1" rx="6"/>
  <text x="180" y="115" fill="#569cd6" font-size="14" text-anchor="middle" font-weight="bold">DB-25 Male</text>
  <text x="180" y="132" fill="#808080" font-size="11" text-anchor="middle">(Controller Side)</text>

  <!-- DB-25 pins -->
  <circle cx="90" cy="165" r="8" fill="#3c3c3c" stroke="#666"/>
  <text x="90" y="169" fill="#d4d4d4" font-size="10" text-anchor="middle">1</text>
  <text x="115" y="169" fill="#808080" font-size="10">Shield GND</text>

  <circle cx="90" cy="200" r="8" fill="#4ec9b0" stroke="#4ec9b0"/>
  <text x="90" y="204" fill="#1e1e1e" font-size="10" text-anchor="middle" font-weight="bold">2</text>
  <text x="115" y="204" fill="#4ec9b0" font-size="10">TX Data →</text>

  <circle cx="90" cy="235" r="8" fill="#ce9178" stroke="#ce9178"/>
  <text x="90" y="239" fill="#1e1e1e" font-size="10" text-anchor="middle" font-weight="bold">3</text>
  <text x="115" y="239" fill="#ce9178" font-size="10">RX Data ←</text>

  <circle cx="90" cy="270" r="8" fill="#dcdcaa" stroke="#dcdcaa"/>
  <text x="90" y="274" fill="#1e1e1e" font-size="10" text-anchor="middle" font-weight="bold">4</text>
  <text x="115" y="274" fill="#dcdcaa" font-size="10">RTS</text>

  <circle cx="90" cy="295" r="8" fill="#dcdcaa" stroke="#dcdcaa"/>
  <text x="90" y="299" fill="#1e1e1e" font-size="10" text-anchor="middle" font-weight="bold">5</text>
  <text x="115" y="299" fill="#dcdcaa" font-size="10">CTS</text>

  <circle cx="90" cy="320" r="8" fill="#dcdcaa" stroke="#dcdcaa"/>
  <text x="90" y="324" fill="#1e1e1e" font-size="10" text-anchor="middle" font-weight="bold">6</text>
  <text x="115" y="324" fill="#dcdcaa" font-size="10">DSR</text>

  <circle cx="90" cy="350" r="8" fill="#3c3c3c" stroke="#666"/>
  <text x="90" y="354" fill="#d4d4d4" font-size="10" text-anchor="middle">7</text>
  <text x="115" y="354" fill="#808080" font-size="10">Signal GND</text>

  <circle cx="90" cy="380" r="8" fill="#dcdcaa" stroke="#dcdcaa"/>
  <text x="90" y="384" fill="#1e1e1e" font-size="10" text-anchor="middle" font-weight="bold">8</text>
  <text x="115" y="384" fill="#dcdcaa" font-size="10">DCD</text>

  <circle cx="90" cy="410" r="8" fill="#dcdcaa" stroke="#dcdcaa"/>
  <text x="90" y="414" fill="#1e1e1e" font-size="10" text-anchor="middle" font-weight="bold">20</text>
  <text x="115" y="414" fill="#dcdcaa" font-size="10">DTR</text>

  <!-- Jumper bracket for pins 4,5,6,8,20 -->
  <path d="M 240 270 L 260 270 L 260 414 L 240 414" fill="none" stroke="#dcdcaa" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M 260 295 L 240 295" fill="none" stroke="#dcdcaa" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M 260 320 L 240 320" fill="none" stroke="#dcdcaa" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M 260 384 L 240 384" fill="none" stroke="#dcdcaa" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="265" y="330" width="70" height="24" fill="#dcdcaa" rx="3" opacity="0.15"/>
  <text x="300" y="346" fill="#dcdcaa" font-size="10" text-anchor="middle" font-weight="bold">JUMPER</text>

  <!-- DB-9 Female Connector (PC Side) -->
  <rect x="490" y="90" width="260" height="340" fill="#2d2d2d" stroke="#555" stroke-width="1" rx="6"/>
  <text x="620" y="115" fill="#569cd6" font-size="14" text-anchor="middle" font-weight="bold">DB-9 Female</text>
  <text x="620" y="132" fill="#808080" font-size="11" text-anchor="middle">(PC / USB-Serial Adapter)</text>

  <!-- DB-9 pins -->
  <circle cx="710" cy="200" r="8" fill="#4ec9b0" stroke="#4ec9b0"/>
  <text x="710" y="204" fill="#1e1e1e" font-size="10" text-anchor="middle" font-weight="bold">2</text>
  <text x="685" y="204" fill="#4ec9b0" font-size="10" text-anchor="end">← RX Data</text>

  <circle cx="710" cy="235" r="8" fill="#ce9178" stroke="#ce9178"/>
  <text x="710" y="239" fill="#1e1e1e" font-size="10" text-anchor="middle" font-weight="bold">3</text>
  <text x="685" y="239" fill="#ce9178" font-size="10" text-anchor="end">TX Data →</text>

  <circle cx="710" cy="350" r="8" fill="#3c3c3c" stroke="#666"/>
  <text x="710" y="354" fill="#d4d4d4" font-size="10" text-anchor="middle">5</text>
  <text x="685" y="354" fill="#808080" font-size="10" text-anchor="end">Signal GND</text>

  <!-- Wires -->
  <!-- Pin 2 (TX) → Pin 2 (RX) GREEN -->
  <line x1="240" y1="200" x2="505" y2="200" stroke="#4ec9b0" stroke-width="2.5"/>
  <polygon points="500,196 510,200 500,204" fill="#4ec9b0"/>

  <!-- Pin 3 (RX) ← Pin 3 (TX) ORANGE -->
  <line x1="240" y1="235" x2="505" y2="235" stroke="#ce9178" stroke-width="2.5"/>
  <polygon points="245,231 235,235 245,239" fill="#ce9178"/>

  <!-- Pin 7 (GND) — Pin 5 (GND) GRAY -->
  <line x1="240" y1="350" x2="505" y2="350" stroke="#808080" stroke-width="2.5"/>

  <!-- Pin 1 (Shield) — Pin 5 (GND) GRAY DASHED -->
  <line x1="240" y1="165" x2="370" y2="165" stroke="#808080" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="370" y1="165" x2="370" y2="350" stroke="#808080" stroke-width="1.5" stroke-dasharray="6,3"/>
  <circle cx="370" cy="350" r="3" fill="#808080"/>

  <!-- Legend -->
  <rect x="50" y="450" width="700" height="40" fill="#252525" stroke="#444" rx="4"/>
  <line x1="70" y1="470" x2="100" y2="470" stroke="#4ec9b0" stroke-width="2.5"/>
  <text x="105" y="474" fill="#d4d4d4" font-size="11">TX → RX (Data)</text>
  <line x1="240" y1="470" x2="270" y2="470" stroke="#ce9178" stroke-width="2.5"/>
  <text x="275" y="474" fill="#d4d4d4" font-size="11">RX ← TX (Data)</text>
  <line x1="410" y1="470" x2="440" y2="470" stroke="#808080" stroke-width="2.5"/>
  <text x="445" y="474" fill="#d4d4d4" font-size="11">GND</text>
  <line x1="520" y1="470" x2="550" y2="470" stroke="#dcdcaa" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="555" y="474" fill="#d4d4d4" font-size="11">Handshake Jumper (bridge together)</text>
</svg>
