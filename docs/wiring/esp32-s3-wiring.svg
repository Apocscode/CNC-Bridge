<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Consolas, monospace">
  <!-- Background -->
  <rect width="900" height="600" fill="#1e1e1e" rx="8"/>
  
  <!-- Title -->
  <text x="450" y="35" fill="#d4d4d4" font-size="18" text-anchor="middle" font-weight="bold">CNC Bridge — ESP32-S3 DevKitC Wiring Diagram</text>
  <text x="450" y="55" fill="#808080" font-size="12" text-anchor="middle">USB-C (PC) + MAX3232 RS232 Level Shifter → Controller</text>

  <!-- ESP32-S3 Board -->
  <rect x="300" y="90" width="300" height="380" fill="#2d2d2d" stroke="#569cd6" stroke-width="2" rx="8"/>
  <rect x="410" y="75" width="80" height="25" fill="#444" stroke="#666" rx="3"/>
  <text x="450" y="92" fill="#d4d4d4" font-size="10" text-anchor="middle">USB-C</text>
  <text x="450" y="125" fill="#569cd6" font-size="16" text-anchor="middle" font-weight="bold">ESP32-S3</text>
  <text x="450" y="143" fill="#808080" font-size="11" text-anchor="middle">DevKitC-1</text>

  <!-- Left side pins -->
  <text x="350" y="175" fill="#808080" font-size="10" text-anchor="middle">Left Header</text>

  <!-- 3V3 -->
  <rect x="310" y="190" width="60" height="20" fill="#3c3c3c" stroke="#4ec9b0" rx="2"/>
  <text x="340" y="204" fill="#4ec9b0" font-size="10" text-anchor="middle">3V3</text>

  <!-- GND -->
  <rect x="310" y="220" width="60" height="20" fill="#3c3c3c" stroke="#808080" rx="2"/>
  <text x="340" y="234" fill="#808080" font-size="10" text-anchor="middle">GND</text>

  <!-- GPIO17 (UART TX) -->
  <rect x="310" y="260" width="60" height="20" fill="#3c3c3c" stroke="#4ec9b0" rx="2"/>
  <text x="340" y="274" fill="#4ec9b0" font-size="10" text-anchor="middle">GPIO17</text>
  <text x="340" y="290" fill="#666" font-size="9" text-anchor="middle">UART1 TX</text>

  <!-- GPIO18 (UART RX) -->
  <rect x="310" y="300" width="60" height="20" fill="#3c3c3c" stroke="#ce9178" rx="2"/>
  <text x="340" y="314" fill="#ce9178" font-size="10" text-anchor="middle">GPIO18</text>
  <text x="340" y="330" fill="#666" font-size="9" text-anchor="middle">UART1 RX</text>

  <!-- Right side pins -->
  <text x="550" y="175" fill="#808080" font-size="10" text-anchor="middle">Right Header</text>

  <!-- GPIO2 (Status LED) -->
  <rect x="530" y="190" width="60" height="20" fill="#3c3c3c" stroke="#dcdcaa" rx="2"/>
  <text x="560" y="204" fill="#dcdcaa" font-size="10" text-anchor="middle">GPIO2</text>
  <text x="560" y="218" fill="#666" font-size="9" text-anchor="middle">Status LED</text>

  <!-- GPIO48 (RGB LED) -->
  <rect x="530" y="240" width="60" height="20" fill="#3c3c3c" stroke="#c586c0" rx="2"/>
  <text x="560" y="254" fill="#c586c0" font-size="10" text-anchor="middle">GPIO48</text>
  <text x="560" y="268" fill="#666" font-size="9" text-anchor="middle">RGB LED</text>

  <!-- MAX3232 Module -->
  <rect x="30" y="180" width="200" height="220" fill="#2d2d2d" stroke="#ce9178" stroke-width="2" rx="8"/>
  <text x="130" y="210" fill="#ce9178" font-size="14" text-anchor="middle" font-weight="bold">MAX3232</text>
  <text x="130" y="228" fill="#808080" font-size="11" text-anchor="middle">Level Shifter</text>

  <!-- MAX3232 TTL side -->
  <text x="130" y="255" fill="#808080" font-size="10" text-anchor="middle">TTL Side (3.3V)</text>
  <rect x="50" y="265" width="60" height="18" fill="#3c3c3c" stroke="#4ec9b0" rx="2"/>
  <text x="80" y="278" fill="#4ec9b0" font-size="9" text-anchor="middle">VCC</text>
  <rect x="50" y="290" width="60" height="18" fill="#3c3c3c" stroke="#808080" rx="2"/>
  <text x="80" y="303" fill="#808080" font-size="9" text-anchor="middle">GND</text>
  <rect x="50" y="315" width="60" height="18" fill="#3c3c3c" stroke="#4ec9b0" rx="2"/>
  <text x="80" y="328" fill="#4ec9b0" font-size="9" text-anchor="middle">TX-I</text>
  <rect x="50" y="340" width="60" height="18" fill="#3c3c3c" stroke="#ce9178" rx="2"/>
  <text x="80" y="353" fill="#ce9178" font-size="9" text-anchor="middle">RX-O</text>

  <!-- MAX3232 RS232 side -->
  <text x="130" y="380" fill="#808080" font-size="10" text-anchor="middle">RS232 Side (±12V)</text>
  <rect x="140" y="265" width="70" height="18" fill="#3c3c3c" stroke="#4ec9b0" rx="2"/>
  <text x="175" y="278" fill="#4ec9b0" font-size="9" text-anchor="middle">TX-O</text>
  <rect x="140" y="290" width="70" height="18" fill="#3c3c3c" stroke="#ce9178" rx="2"/>
  <text x="175" y="303" fill="#ce9178" font-size="9" text-anchor="middle">RX-I</text>

  <!-- Wires: ESP32 → MAX3232 TTL side -->
  <!-- 3V3 → VCC -->
  <line x1="310" y1="200" x2="110" y2="274" stroke="#4ec9b0" stroke-width="2"/>
  <text x="200" y="228" fill="#4ec9b0" font-size="9" transform="rotate(-10 200 228)">3.3V Power</text>

  <!-- GND → GND -->
  <line x1="310" y1="230" x2="110" y2="299" stroke="#808080" stroke-width="2"/>

  <!-- GPIO17 TX → TX-I -->
  <line x1="310" y1="270" x2="110" y2="324" stroke="#4ec9b0" stroke-width="2.5"/>
  <polygon points="115,320 105,324 115,328" fill="#4ec9b0"/>

  <!-- GPIO18 RX ← RX-O -->
  <line x1="310" y1="310" x2="110" y2="349" stroke="#ce9178" stroke-width="2.5"/>
  <polygon points="305,306 315,310 305,314" fill="#ce9178"/>

  <!-- DB-25 Connector (far right) -->
  <rect x="700" y="180" width="170" height="220" fill="#2d2d2d" stroke="#dcdcaa" stroke-width="2" rx="8"/>
  <text x="785" y="210" fill="#dcdcaa" font-size="14" text-anchor="middle" font-weight="bold">DB-25 Male</text>
  <text x="785" y="228" fill="#808080" font-size="11" text-anchor="middle">To Controller</text>

  <rect x="720" y="250" width="50" height="18" fill="#3c3c3c" stroke="#4ec9b0" rx="2"/>
  <text x="745" y="263" fill="#4ec9b0" font-size="9" text-anchor="middle">Pin 2</text>
  <text x="780" y="263" fill="#666" font-size="9">TX</text>

  <rect x="720" y="275" width="50" height="18" fill="#3c3c3c" stroke="#ce9178" rx="2"/>
  <text x="745" y="288" fill="#ce9178" font-size="9" text-anchor="middle">Pin 3</text>
  <text x="780" y="288" fill="#666" font-size="9">RX</text>

  <rect x="720" y="300" width="50" height="18" fill="#3c3c3c" stroke="#808080" rx="2"/>
  <text x="745" y="313" fill="#808080" font-size="9" text-anchor="middle">Pin 7</text>
  <text x="780" y="313" fill="#666" font-size="9">GND</text>

  <rect x="720" y="330" width="130" height="18" fill="#dcdcaa" fill-opacity="0.15" stroke="#dcdcaa" rx="2"/>
  <text x="785" y="343" fill="#dcdcaa" font-size="9" text-anchor="middle">4-5-6-8-20 JUMPER</text>

  <!-- Wires: MAX3232 RS232 → DB-25 -->
  <!-- TX-O → Pin 2 -->
  <line x1="210" y1="274" x2="720" y2="259" stroke="#4ec9b0" stroke-width="2"/>
  <polygon points="715,255 725,259 715,263" fill="#4ec9b0"/>

  <!-- RX-I ← Pin 3 -->
  <line x1="210" y1="299" x2="720" y2="284" stroke="#ce9178" stroke-width="2"/>
  <polygon points="215,295 205,299 215,303" fill="#ce9178"/>

  <!-- GND → Pin 7 (from ESP32 GND) -->
  <path d="M 110 299 L 30 299 L 30 450 L 745 450 L 745 318" fill="none" stroke="#808080" stroke-width="2"/>

  <!-- Status LED -->
  <rect x="660" y="90" width="80" height="40" fill="#2d2d2d" stroke="#dcdcaa" rx="4"/>
  <text x="700" y="108" fill="#dcdcaa" font-size="10" text-anchor="middle">Status</text>
  <text x="700" y="122" fill="#dcdcaa" font-size="10" text-anchor="middle">LED</text>
  <line x1="590" y1="200" x2="660" y2="110" stroke="#dcdcaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="155" fill="#666" font-size="9">220Ω resistor</text>

  <!-- USB label -->
  <line x1="450" y1="75" x2="450" y2="60" stroke="#d4d4d4" stroke-width="1.5"/>
  <text x="450" y="72" fill="#d4d4d4" font-size="10" text-anchor="middle">To PC</text>

  <!-- Legend -->
  <rect x="30" y="480" width="840" height="45" fill="#252525" stroke="#444" rx="4"/>
  <line x1="50" y1="505" x2="80" y2="505" stroke="#4ec9b0" stroke-width="2.5"/>
  <text x="85" y="509" fill="#d4d4d4" font-size="11">TX Signal</text>
  <line x1="180" y1="505" x2="210" y2="505" stroke="#ce9178" stroke-width="2.5"/>
  <text x="215" y="509" fill="#d4d4d4" font-size="11">RX Signal</text>
  <line x1="310" y1="505" x2="340" y2="505" stroke="#808080" stroke-width="2.5"/>
  <text x="345" y="509" fill="#d4d4d4" font-size="11">GND</text>
  <line x1="420" y1="505" x2="450" y2="505" stroke="#dcdcaa" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="455" y="509" fill="#d4d4d4" font-size="11">Jumper</text>
  <text x="550" y="509" fill="#808080" font-size="11">| MAX3232 converts TTL 3.3V ↔ RS232 ±12V signals</text>

  <!-- Flow arrows -->
  <text x="450" y="560" fill="#569cd6" font-size="13" text-anchor="middle" font-weight="bold">PC (USB-C) → ESP32-S3 → MAX3232 → RS232 Cable → Controller</text>
  <text x="450" y="580" fill="#808080" font-size="11" text-anchor="middle">Data flow is bidirectional — ESP32 acts as USB-CDC serial bridge</text>
</svg>
