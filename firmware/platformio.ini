; CNC Bridge — ESP32-S3 Firmware
; PlatformIO configuration for the hardware serial bridge
;
; Hardware connections:
;   ESP32-S3 UART1 ←→ MAX3232 ←→ Anilam Crusader M (DB-25 RS232)
;   ESP32-S3 USB   ←→ PC  (or WiFi for wireless operation)
;   SD card module  ←→ SPI bus
;   OLED display    ←→ I2C bus

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    ; SD card
    SPI
    SD
    ; OLED display (SSD1306 128x64)
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    ; JSON for config and web API
    bblanchon/ArduinoJson@^6.21.3
    ; Async web server for WiFi mode
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; Serial monitor filters
monitor_filters = esp32_exception_decoder
